<!-- #region head-->
<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script
      src="src/scripts/main.js"
      defer
    ></script>
  </head>
  <!-- #endregion head-->
  <body class="page__body">
    <!--- #region header -->
    <header class="header">
      <div class="header__content">
        <div class="top-bar">
          <a href="#">
            <img
              src="src/images/logo-bg-mobile.svg"
              alt="Logo"
              class="top-bar__logo"
            />
          </a>
          <div class="top-bar__icons">
            <a href="tel:+1 234 555-55-55" class="icon icon--phone"></a>
            <a href="#menu" class="icon icon--menu"></a>
          </div>
        </div>
        <div class="header__bottom">
          <div class="header__titel">
            Your senses.
            <br/>
            Set free
          </div>
        </div>
      </div>
    </header>

    <aside class="page__menu menu" id="menu">
      <div class="menu__content">
        <div class="top-bar menu__top">
          <a href="#">
            <img
              src="src/images/logo-bg-mobile.svg"
              alt="Logo"
              class="top-bar__logo"
            />
          </a>
          <a
            href="#"
            class="menu__close icon icon--close"
          ></a>
        </div>

        <div class="menu__bottom">
          <nav class="nav menu__nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a
                  href="#recommended"
                  class="nav__link"
                  >Recommended
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#categories"
                  class="nav__link"
                  >Categories
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#about-us"
                  class="nav__link"
                  >About Us
                </a>
              </li>
              <li class="nav__item">
                <a
                  href="#contact-us"
                  class="nav__link"
                  >Contact Us
                </a>
              </li>
            </ul>
          </nav>
          <a href="tel:+1 234 5555-55-55" class="nav__phone-number">
            +1 234 5555-55-55
          </a>
          <a href="tel:+1 234 5555-55-55" class="nav__call-to-order">
            Call to order
          </a>
        </div>
      </div>
    </aside>
    <!--- #endregion header -->
    <!--- #region main -->
    <main class="main">
      <section class="recommended" id="recommended">
        <h2>Recommended</h2>
      </section>
      <section class="categories" id="categories">
        <h2>
          Categories
        </h2>
      </section>
      <section class="about-us" id="about-us">
        <h2>About Us</h2>
      </section>
      <section class="contact-us" id="contact-us">
        <h2>Contact Us</h2>
      </section>
    </main>
    <!--- #endregion main -->
  </body>
</html>
